name: Validate optimized dynamic shadow map

on:
  pull_request:
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

concurrency:
  group: validate-shadow-map-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-shadow-map-pcf
          submodules: recursive
          fetch-depth: 0

      - name: Use dynamic-shadow libultraship branch
        run: |
          git -C libultraship fetch origin agent/dynamic-shadow-map-pcf
          git -C libultraship checkout --detach origin/agent/dynamic-shadow-map-pcf

      - name: Apply camera-frustum caster culling
        run: python3 tools/apply_shadow_frustum_culling.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool

      - name: Install SDL 2.30.3
        run: |
          mkdir -p deps
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
          cd deps/SDL2-2.30.3
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install tinyxml2 10
        run: |
          sudo apt-get remove -y libtinyxml2-dev || true
          wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
          cmake -S deps/tinyxml2-10.0.0 -B deps/tinyxml2-10.0.0/build
          cmake --build deps/tinyxml2-10.0.0/build --parallel 10
          sudo cmake --install deps/tinyxml2-10.0.0/build

      - name: Generate soh.o2r
        run: |
          cmake --no-warn-unused-cli -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target GenerateSohOtr --parallel 3

      - name: Upload soh.o2r
        uses: actions/upload-artifact@v4
        with:
          name: soh-o2r-shadow-map
          path: soh.o2r
          if-no-files-found: error
          retention-days: 2

  build-windows-and-commit:
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-shadow-map-pcf
          submodules: recursive
          fetch-depth: 0

      - name: Use validated dynamic-shadow libultraship branch
        shell: pwsh
        run: |
          git -C libultraship fetch origin agent/dynamic-shadow-map-pcf
          git -C libultraship checkout --detach origin/agent/dynamic-shadow-map-pcf

      - name: Apply camera-frustum caster culling
        shell: pwsh
        run: python tools/apply_shadow_frustum_culling.py

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download soh.o2r
        uses: actions/download-artifact@v4
        with:
          name: soh-o2r-shadow-map
          path: build-windows/soh

      - name: Build and package Windows x64
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake -S . -B build-windows -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DBUILD_REMOTE_CONTROL=1
          cmake --build build-windows --config Release --parallel 10
          Push-Location build-windows
          cpack
          Pop-Location

      - name: Commit validated game integration
        shell: pwsh
        run: |
          Remove-Item tools/apply_shadow_frustum_culling.py -Force
          Remove-Item .github/workflows/validate-dynamic-shadow-map.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soh/soh/Enhancements/Graphics/ToonLighting.cpp libultraship tools/apply_shadow_frustum_culling.py .github/workflows/validate-dynamic-shadow-map.yml
          git commit -m "Integrate optimized dynamic shadow map and camera frustum culling [shadow-map-integrated]"
          git push origin HEAD:agent/dynamic-shadow-map-pcf
