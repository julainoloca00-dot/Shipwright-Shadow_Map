name: one-time branch cleanup

on:
  push:
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      KEEP_BRANCH: wind-waker-style-cel-shading
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Confirm celshade as default branch
        shell: bash
        run: |
          set +e
          status=$(curl -sS -o /tmp/default-branch-response.json -w "%{http_code}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d "{\"default_branch\":\"${KEEP_BRANCH}\"}")
          echo "Default branch API status: ${status}"
          cat /tmp/default-branch-response.json || true
          exit 0

      - name: Delete every other branch
        shell: bash
        run: |
          set +e
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | while read -r branch; do
            if [ -n "$branch" ] && [ "$branch" != "$KEEP_BRANCH" ]; then
              echo "Deleting branch: $branch"
              git push origin --delete "$branch" || true
            fi
          done
          exit 0

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-branches.yml .cleanup-branches-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time branch cleanup"
            git push origin HEAD:${KEEP_BRANCH}
          fi
