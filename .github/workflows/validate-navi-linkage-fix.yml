name: Validate Navi linkage fix

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .navi-linkage-build-trigger

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    outputs:
      final_exit: ${{ steps.compile.outputs.final_exit }}
    steps:
      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Apply realistic shadow fixes
        shell: pwsh
        run: |
          python scripts/apply_realistic_shadow_fixes.py
          python scripts/refine_realistic_shadow_fixes.py

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          save: true
          key: ${{ runner.os }}-navi-linkage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-navi-diagnostic-
            ${{ runner.os }}-navi-final-shadow-
            ${{ runner.os }}-ccache

      - name: Restore Cached VCPKG folder
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download validated soh.o2r
        uses: actions/download-artifact@v7
        with:
          name: soh.o2r
          path: build-windows/soh
          github-token: ${{ github.token }}
          run-id: 30121121977

      - name: Build, package and capture result
        id: compile
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          $log = Join-Path $PWD "_navi-linkage-build.log"
          $summary = Join-Path $PWD "_navi-linkage-summary.txt"
          $exitCode = 0
          $stage = "configure"

          & cmake -S . -B build-windows -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DBUILD_REMOTE_CONTROL=1 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            $stage = "compile"
            & cmake --build build-windows --config Release --parallel 10 2>&1 | Tee-Object -FilePath $log -Append
            $exitCode = $LASTEXITCODE
          }

          if ($exitCode -eq 0) {
            $stage = "package"
            Push-Location build-windows
            cpack 2>&1 | Tee-Object -FilePath $log -Append
            $exitCode = $LASTEXITCODE
            Pop-Location
          }

          if ($exitCode -eq 0) {
            $zip = @(
              Get-ChildItem -Path "_packages" -Filter "*.zip" -File -ErrorAction SilentlyContinue
              Get-ChildItem -Path "build-windows/_packages" -Filter "*.zip" -File -ErrorAction SilentlyContinue
            ) | Select-Object -First 1
            if ($zip) {
              New-Item -ItemType Directory -Path "_packages" -Force | Out-Null
              Copy-Item $zip.FullName "_packages/soh-windows-navi-light-fixed.zip" -Force
            } else {
              $exitCode = 2
              "CPack succeeded but no ZIP was found." | Add-Content -Path $log
            }
          }

          $lines = Get-Content -Path $log
          $important = $lines | Select-String -Pattern "error C[0-9]+|fatal error|CMake Error|FAILED:|LNK[0-9]+|ninja: build stopped|error:" -Context 3,6
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "head_sha=$env:GITHUB_SHA"
            "stage=$stage"
            "exit_code=$exitCode"
            ""
            "=== FILTERED ERRORS ==="
            ($important | Out-String)
            "=== LAST 160 LINES ==="
            (($lines | Select-Object -Last 160) -join [Environment]::NewLine)
          ) | Set-Content -Path $summary -Encoding utf8

          "final_exit=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navi-linkage-build-summary
          path: |
            _navi-linkage-summary.txt
            _navi-linkage-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload corrected Windows package
        if: steps.compile.outputs.final_exit == '0'
        uses: actions/upload-artifact@v7
        with:
          name: soh-windows-navi-light-fixed
          path: _packages/soh-windows-navi-light-fixed.zip
          if-no-files-found: error
          retention-days: 3

  record-result:
    name: Record Windows result
    needs: build-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current celshade branch
        uses: actions/checkout@v6
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Download summary
        uses: actions/download-artifact@v7
        with:
          name: navi-linkage-build-summary
          path: summary

      - name: Commit result and clean workflow
        shell: bash
        run: |
          cp summary/_navi-linkage-summary.txt .navi-linkage-build-summary.txt
          cat > .navi-linkage-build-result.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "job_result": "${{ needs.build-windows.result }}",
            "build_exit": "${{ needs.build-windows.outputs.final_exit }}"
          }
          EOF
          rm -f .navi-linkage-build-trigger
          rm -f .github/workflows/validate-navi-linkage-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .navi-linkage-build-summary.txt .navi-linkage-build-result.json .navi-linkage-build-trigger .github/workflows/validate-navi-linkage-fix.yml
          git commit -m "Record Navi linkage build result"
          git push origin HEAD:wind-waker-style-cel-shading
