name: Apply tree foliage shadow caster fix

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .github/workflows/apply-tree-shadow-casters.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Enable tree and foliage shadow capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('soh/soh/Enhancements/Graphics/ToonLighting.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''        case ACTOR_BG_MIZU_WATER: // water-box surfaces
        case ACTOR_BG_HAKA_WATER:
        case ACTOR_EN_WOOD02:  // trees / bushes / leaf scenery
        case ACTOR_OBJ_SWITCH: // floor/crystal/eye switches — environment fixtures, not relit objects.
'''
          new = '''        case ACTOR_BG_MIZU_WATER: // water-box surfaces
        case ACTOR_BG_HAKA_WATER:
        case ACTOR_OBJ_SWITCH: // floor/crystal/eye switches — environment fixtures, not relit objects.
'''
          if text.count(old) != 1:
              raise SystemExit('tree exclusion block not found exactly once')
          text = text.replace(old, new, 1)

          old = '''static bool ToonShadowExcluded(Actor* actor) {
    switch (actor->id) {
'''
          new = '''static bool ToonShadowExcluded(Actor* actor) {
    // Trees are receiver actors, but unlike platforms they must also cast: the opaque stream captures
    // trunks and the XLU stream captures the geometric foliage cards. Other receivers remain excluded
    // to avoid self-shadowing their own walkable surfaces.
    if (actor->id == ACTOR_EN_WOOD02) {
        return false;
    }
    switch (actor->id) {
'''
          if text.count(old) != 1:
              raise SystemExit('ToonShadowExcluded entry not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            gSPToonShadow(POLY_OPA_DISP++, 0, 0, 0, 0.0f);
            CLOSE_DISPS(play->state.gfxCtx);
'''
          new = '''            gSPToonShadow(POLY_OPA_DISP++, 0, 0, 0, 0.0f);
            gSPToonShadow(POLY_XLU_DISP++, 0, 0, 0, 0.0f);
            CLOSE_DISPS(play->state.gfxCtx);
'''
          if text.count(old) != 1:
              raise SystemExit('excluded actor disarm block not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            gSPToonShadowArm(POLY_OPA_DISP++, feetClamp, st.shadowScale); // planeD = eased size scale
        } else {
            gSPToonShadow(POLY_OPA_DISP++, 0, 0, 0, 0.0f); // fully off
        }
'''
          new = '''            gSPToonShadowArm(POLY_OPA_DISP++, feetClamp, st.shadowScale); // planeD = eased size scale
            if (actor->id == ACTOR_EN_WOOD02) {
                // Tree canopies are submitted through POLY_XLU. Arm that stream only for En_Wood02 so
                // foliage geometry contributes to the directional depth map without making particles,
                // water, fairy effects, or other translucent actors cast solid shadows.
                gSPToonShadowArm(POLY_XLU_DISP++, feetClamp, st.shadowScale);
            } else {
                // A previous tree may have armed the deferred XLU stream; every following actor closes
                // that boundary explicitly so its translucent effects cannot leak into the tree shadow.
                gSPToonShadow(POLY_XLU_DISP++, 0, 0, 0, 0.0f);
            }
        } else {
            gSPToonShadow(POLY_OPA_DISP++, 0, 0, 0, 0.0f); // fully off
            gSPToonShadow(POLY_XLU_DISP++, 0, 0, 0, 0.0f);
        }
'''
          if text.count(old) != 1:
              raise SystemExit('shadow arm block not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    // Blacklist (doors/trees/water): excluded actors get neither cel relight nor a shadow. When cel shading
'''
          new = '''    // Blacklist (doors/water/oversized scenery): excluded actors get neither cel relight nor a shadow. Trees
    // intentionally stay in the normal path so trunks and foliage receive lighting and cast into the map. When cel shading
'''
          if text.count(old) != 1:
              raise SystemExit('blacklist comment not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-tree-shadow-casters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soh/soh/Enhancements/Graphics/ToonLighting.cpp .github/workflows/apply-tree-shadow-casters.yml
          git commit -m "Enable tree and foliage shadow casters"
          git push origin HEAD:wind-waker-style-cel-shading
