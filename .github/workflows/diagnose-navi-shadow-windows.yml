name: Diagnose Navi shadow Windows build

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .navi-shadow-diagnostic-trigger

permissions:
  contents: write
  actions: read

jobs:
  diagnose-windows:
    name: Diagnose Windows x64
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Apply realistic shadow fixes
        shell: pwsh
        run: |
          python scripts/apply_realistic_shadow_fixes.py
          python scripts/refine_realistic_shadow_fixes.py

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          save: true
          key: ${{ runner.os }}-navi-diagnostic-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-navi-final-shadow-
            ${{ runner.os }}-navi-shadow-
            ${{ runner.os }}-ccache

      - name: Restore Cached VCPKG folder
        id: restore-cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download validated soh.o2r
        uses: actions/download-artifact@v7
        with:
          name: soh.o2r
          path: build-windows/soh
          github-token: ${{ github.token }}
          run-id: 30121121977

      - name: Compile and capture diagnostics
        id: compile
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          $logPath = Join-Path $PWD "_navi-build-full.log"
          $diagnosticPath = Join-Path $PWD "_navi-build-diagnostics.txt"
          $buildExit = 0
          $stage = "configure"

          "Navi shadow Windows diagnostic" | Set-Content -Path $logPath -Encoding utf8
          "Run ID: $env:GITHUB_RUN_ID" | Add-Content -Path $logPath
          "Head SHA: $env:GITHUB_SHA" | Add-Content -Path $logPath

          & cmake -S . -B build-windows -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DBUILD_REMOTE_CONTROL=1 2>&1 | Tee-Object -FilePath $logPath -Append
          $buildExit = $LASTEXITCODE

          if ($buildExit -eq 0) {
            $stage = "compile"
            & cmake --build build-windows --config Release --parallel 10 2>&1 | Tee-Object -FilePath $logPath -Append
            $buildExit = $LASTEXITCODE
          }

          $lines = Get-Content -Path $logPath
          $important = $lines | Select-String -Pattern "error C[0-9]+|fatal error|CMake Error|FAILED:|ninja: build stopped|undefined reference|unresolved external|error:" -Context 3,6
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "head_sha=$env:GITHUB_SHA"
            "stage=$stage"
            "exit_code=$buildExit"
            ""
            "=== FILTERED ERRORS ==="
            ($important | Out-String)
            "=== LAST 240 LINES ==="
            (($lines | Select-Object -Last 240) -join [Environment]::NewLine)
          ) | Set-Content -Path $diagnosticPath -Encoding utf8

          "build_exit=$buildExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($buildExit -eq 0) {
            Push-Location build-windows
            cpack 2>&1 | Tee-Object -FilePath $logPath -Append
            $packageExit = $LASTEXITCODE
            Pop-Location
            if ($packageExit -ne 0) {
              "CPack failed with exit code $packageExit" | Add-Content -Path $diagnosticPath
              "package_exit=$packageExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              $zip = @(
                Get-ChildItem -Path "_packages" -Filter "*.zip" -File -ErrorAction SilentlyContinue
                Get-ChildItem -Path "build-windows/_packages" -Filter "*.zip" -File -ErrorAction SilentlyContinue
              ) | Select-Object -First 1
              if ($zip) {
                New-Item -ItemType Directory -Path "_packages" -Force | Out-Null
                Copy-Item $zip.FullName "_packages/soh-windows-navi-shadow-fix.zip" -Force
              } else {
                "CPack returned success but no ZIP was found." | Add-Content -Path $diagnosticPath
              }
            }
          }

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navi-shadow-build-diagnostics
          path: |
            _navi-build-diagnostics.txt
            _navi-build-full.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload corrected Windows package
        if: steps.compile.outputs.build_exit == '0'
        uses: actions/upload-artifact@v7
        with:
          name: soh-windows-navi-shadow-caster-fix
          path: _packages/soh-windows-navi-shadow-fix.zip
          if-no-files-found: warn
          retention-days: 3

  record-diagnostics:
    name: Record diagnostics
    needs: diagnose-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current celshade branch
        uses: actions/checkout@v6
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Download diagnostic artifact
        uses: actions/download-artifact@v7
        with:
          name: navi-shadow-build-diagnostics
          path: diagnostic

      - name: Commit diagnostic summary and clean workflow
        shell: bash
        run: |
          cp diagnostic/_navi-build-diagnostics.txt .navi-shadow-build-diagnostics.txt
          cat > .navi-shadow-diagnostic-result.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "windows_job": "${{ needs.diagnose-windows.result }}"
          }
          EOF
          rm -f .navi-shadow-diagnostic-trigger
          rm -f .github/workflows/diagnose-navi-shadow-windows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .navi-shadow-build-diagnostics.txt .navi-shadow-diagnostic-result.json .navi-shadow-diagnostic-trigger .github/workflows/diagnose-navi-shadow-windows.yml
          git commit -m "Record Navi shadow Windows diagnostics"
          git push origin HEAD:wind-waker-style-cel-shading
