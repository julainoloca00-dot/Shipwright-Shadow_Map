name: Remove extra branches

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .github/workflows/generate-builds.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove all non-default branches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Restore original workflow
        shell: bash
        run: |
          git checkout HEAD^ -- .github/workflows/generate-builds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/generate-builds.yml
          git commit -m "Restore Windows manual build workflow"
          git push origin HEAD:wind-waker-style-cel-shading

      - name: Delete every non-default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: wind-waker-style-cel-shading
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')

          echo "Branches found:"
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [ "${branch}" = "${DEFAULT_BRANCH}" ]; then
              continue
            fi
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
          done

          mapfile -t remaining < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branch: %s\n' "${remaining[@]}"
          if [ "${#remaining[@]}" -ne 1 ] || [ "${remaining[0]}" != "${DEFAULT_BRANCH}" ]; then
            echo "Branch cleanup validation failed"
            exit 1
          fi
