name: Remove extra branches

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'cleanup-all-extra-branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: wind-waker-style-cel-shading
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')

          echo "Branches found:"
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [ "${branch}" = "${DEFAULT_BRANCH}" ]; then
              continue
            fi
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
          done

          mapfile -t remaining < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branch: %s\n' "${remaining[@]}"
          if [ "${#remaining[@]}" -ne 1 ] || [ "${remaining[0]}" != "${DEFAULT_BRANCH}" ]; then
            echo "Branch cleanup validation failed"
            exit 1
          fi
