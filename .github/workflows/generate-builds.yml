name: Windows manual build

on:
  pull_request:
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

jobs:
  apply-world-shadow-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Pin validated libultraship shadow backend
        run: |
          git -C libultraship fetch origin agent/fix-shadow-camera-stability-pr
          git -C libultraship checkout 7250eae07949590367075fe52a2fec87a18343a2
      - name: Apply game integration
        run: python tools/apply_world_shadow_integration.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libultraship soh/soh/Enhancements/Graphics/ToonLighting.cpp
          git commit -m "Integrate stable environment shadow mapping"
          git push origin HEAD:${{ github.head_ref }}
