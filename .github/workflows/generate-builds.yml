name: Windows manual build

on:
  push:
    branches:
      - agent/stabilize-shadow-quality

permissions:
  contents: write

jobs:
  pin-shadow-backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-shadow-quality
          fetch-depth: 0
          submodules: true
      - name: Pin validated libultraship commit
        run: |
          git -C libultraship fetch origin wind-waker-style-cel-shading
          git -C libultraship checkout 41a4c3fcdc4d5f43255bbdc58b5a6bd151726277
      - name: Commit submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libultraship
          if ! git diff --cached --quiet; then
            git commit -m "Update stabilized shadow backend"
            git push origin HEAD:agent/stabilize-shadow-quality
          fi
