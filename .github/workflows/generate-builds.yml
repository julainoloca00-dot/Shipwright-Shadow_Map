name: Windows manual build

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

jobs:
  consolidate-shadow-branches:
    if: github.event.pull_request.head.ref == 'agent/fix-navi-shadow-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0
          submodules: true

      - name: Update libultraship to consolidated production commit
        shell: bash
        run: |
          git -C libultraship fetch origin wind-waker-style-cel-shading
          git -C libultraship checkout 1f70e6c3404525df54ed755f6df47ce38a73915b
          git add libultraship

      - name: Restore build workflow and commit gitlink
        shell: bash
        run: |
          git checkout HEAD^ -- .github/workflows/generate-builds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libultraship .github/workflows/generate-builds.yml
          git commit -m "Update consolidated libultraship shadow changes"
          git push origin HEAD:wind-waker-style-cel-shading

      - name: Delete consolidated branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          delete_branch() {
            local branch="$1"
            local encoded="${branch//\//%2F}"
            local status
            status=$(curl -sS -L -o /tmp/delete-response -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")
            if [ "${status}" != "204" ] && [ "${status}" != "404" ] && [ "${status}" != "422" ]; then
              cat /tmp/delete-response
              echo "Failed to delete ${branch}: HTTP ${status}"
              return 1
            fi
            echo "${branch}: HTTP ${status}"
          }

          for branch in \
            agent/fix-navi-shadow-map \
            temp-navi-light-fix \
            temp-navi-light-fix-v2 \
            temp-realistic-shadow-build \
            temp-ship-foliage-build \
            temp-tree-shadow-trigger \
            trigger-shadow-build-status \
            trigger-ultra-shadow-final \
            trigger-ultra-shadow-once \
            agent/stabilize-shadow-quality \
            agent/fix-world-shadow-map \
            agent/windows-artifact-build-fix \
            agent/dynamic-shadow-map-pcf \
            agent/link-shadow-map-windows-manual-build \
            main; do
            delete_branch "${branch}" || true
          done
