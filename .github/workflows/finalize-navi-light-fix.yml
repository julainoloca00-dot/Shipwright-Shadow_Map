name: Finalize Navi light fix

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - soh/soh/Enhancements/Graphics/ZZNaviShadowLightFix.cpp

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Remove temporary branches
        shell: bash
        run: |
          git push origin --delete temp-navi-light-fix || true
          git push origin --delete temp-navi-light-fix-v2 || true

      - name: Start corrected Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate-builds.yml/dispatches \
            -d '{"ref":"wind-waker-style-cel-shading"}'

      - name: Remove finalizer workflow
        shell: bash
        run: |
          rm -f .github/workflows/finalize-navi-light-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-navi-light-fix.yml
          git commit -m "Remove one-time Navi light finalizer"
          git push origin HEAD:wind-waker-style-cel-shading
